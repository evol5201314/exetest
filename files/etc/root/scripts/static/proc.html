<!-- 进程管理弹窗（独立文件） -->
<div class="modal active" id="procModal" style="display:none;">
<div class="modal-box" style="max-width:950px;width:94%;">
<span class="close" onclick="window.closeProcModal()">&times;</span>
<h2>📊 进程管理</h2>
<div style="margin:12px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
    <span style="font-size:13px;color:#555;">排序：</span>
    <button class="btn-secondary" onclick="window.loadProcess('rss_mb')" style="padding:4px 14px;font-size:12px;border-radius:4px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;">💾 内存</button>
    <button class="btn-secondary" onclick="window.loadProcess('cpu_percent')" style="padding:4px 14px;font-size:12px;border-radius:4px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;">⚡ CPU</button>
    <button class="btn-secondary" onclick="window.loadProcess('mem_percent')" style="padding:4px 14px;font-size:12px;border-radius:4px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;">📊 内存%</button>
    <button class="btn-secondary" onclick="window.loadProcess('pid')" style="padding:4px 14px;font-size:12px;border-radius:4px;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;">📋 PID</button>
    <span style="font-size:12px;color:#888;margin-left:auto;">共 <span id="procCount">0</span> 个进程</span>
    <button class="refresh-btn" onclick="window.loadProcess('rss_mb')" style="padding:4px 14px;font-size:12px;border-radius:4px;border:1px solid #667eea;background:#667eea;color:#fff;cursor:pointer;">🔄 刷新</button>
</div>
<div id="procTableWrap" style="max-height:450px;overflow-y:auto;border-radius:8px;border:1px solid #e8ecf1;background:#fff;">
    <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead style="position:sticky;top:0;z-index:1;">
            <tr style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;">
                <th style="padding:10px 12px;text-align:left;width:60px;border-radius:8px 0 0 0;">PID</th>
                <th style="padding:10px 12px;text-align:left;">进程名</th>
                <th style="padding:10px 12px;text-align:right;width:90px;">内存(MB)</th>
                <th style="padding:10px 12px;text-align:right;width:80px;">CPU%</th>
                <th style="padding:10px 12px;text-align:right;width:80px;">内存%</th>
                <th style="padding:10px 12px;text-align:center;width:130px;border-radius:0 8px 0 0;">操作</th>
            </tr>
        </thead>
        <tbody id="procTableBody">
            <tr><td colspan="6" style="padding:30px;text-align:center;color:#999;">⏳ 加载中...</td></tr>
        </tbody>
    </table>
</div>
<div style="margin-top:12px;text-align:right;">
    <button onclick="window.closeProcModal()" style="padding:8px 28px;border:none;border-radius:20px;cursor:pointer;font-size:14px;font-weight:500;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;transition:all 0.3s ease;box-shadow:0 2px 8px rgba(102,126,234,0.3);">关闭</button>
</div>
</div>
</div>

<script>
/*
================================================================
⚠️ ⚠️ ⚠️ 窗口创建逻辑与铁律（必读）⚠️ ⚠️ ⚠️
================================================================

【为什么 HTML 注释不能放在文件最前面？】
  如果本文件以 <!-- 注释 --> 开头，app.py 的 loadModal 解析时可能出错，
  导致所有弹窗无法显示。因此，所有说明必须写在 <script> 的 JS 注释中。

【通用弹窗创建流程】
  1. 在 tools/ 下的脚本前10行内添加 # popup: 弹窗ID (例如 # popup: myModal)
  2. 如果需要独立 HTML 文件，再加一行 # html: 文件名.html
     （文件必须放在 /root/scripts/static/ 下）
  3. 在本文件（或独立的 HTML 文件）中添加弹窗的 HTML 结构：
     <div class="modal active" id="myModal" style="display:none;">
       ...
     </div>
  4. 在本文件的 <script> 中（或独立文件的 <script> 中）添加业务函数，
     所有函数必须挂载到 window：
       window.init_myModal = function() { ... };
       window.myAction = function() { ... };
  5. 弹窗右上角的 X 按钮和底部的关闭按钮必须调用 window.closeModalByName('弹窗ID')
  6. 如果使用独立 HTML 文件，该文件中也需要定义 window.closeModalByName （或依赖主文件已加载的该函数）

【函数挂载铁律】
  - 所有需要被 HTML onclick 调用的函数，必须写成 window.xxx = function(){}
  - 初始化函数必须命名为 window.init_弹窗ID
  - 普通辅助函数（如 populateSelect）如果只在弹窗内部使用，可以不挂 window，
    但建议统一挂载以避免作用域问题。

【关闭按钮铁律】
  - 所有弹窗的关闭操作都必须通过 window.closeModalByName 或 window.closeProcModal 等全局关闭函数。
  - 关闭函数应只隐藏弹窗（el.style.display = 'none'），不要删除 DOM，
    否则再次打开时可能出错。
  - 如果需要在关闭时清空容器并重置 modalLoaded（如返回主界面），
    可以保留原有逻辑（container.innerHTML = ''; modalLoaded = false;），
    但必须确保后续打开能重新加载。

【独立 HTML 弹窗的使用】
  - 当脚本头部指定了 # html: 文件名.html 时，面板会加载 /static/ 下的该文件。
  - 独立文件只需包含一个弹窗的 HTML 和对应的 JS，无需包含其他弹窗。
  - 独立文件中的函数也必须挂载到 window。
  - 建议每个独立文件都定义自己的 window.closeModalByName （内容与主文件一致）。

【添加按钮】
  - 在脚本头部添加 # btn: 按钮文字, # group: script/router, # order: 数字,
    # action: runScript:脚本名.py (或 runTool:脚本名.py), # btn-class: 颜色类
  - app.py 会自动扫描并生成按钮，无需手动修改 app.py。

================================================================
*/

window.init_procModal = function() {
    window.loadProcess('rss_mb');
};
window.closeProcModal = function() {
    var el = document.getElementById('procModal');
    if (el) {
        el.style.display = 'none';
        // 可以根据需要决定是否清空容器
        var container = document.getElementById('modalContainer');
        if (container) container.innerHTML = '';
        modalLoaded = false;
    }
};
window.loadProcess = function(sortBy) {
    var tbody = document.getElementById('procTableBody');
    if (!tbody) {
        loadModal('procModal');
        setTimeout(function() { window.loadProcess(sortBy || 'rss_mb'); }, 300);
        return;
    }
    tbody.innerHTML = '<tr><td colspan="6" style="padding:30px;text-align:center;color:#999;">⏳ 加载中...</td></tr>';
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: 'process_manager.py', args: ['--sort', sortBy || 'rss_mb', '--limit', '30', '--json'] })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        var rawOutput = d.output || '';
        if (rawOutput === '') {
            tbody.innerHTML = '<tr><td colspan="6" style="padding:30px;text-align:center;color:#f44336;">❌ 后端返回空数据</td></tr>';
            return;
        }
        try {
            var data = JSON.parse(rawOutput);
            if (!data || !data.length) {
                tbody.innerHTML = '<tr><td colspan="6" style="padding:30px;text-align:center;color:#999;">📭 无进程数据</td></tr>';
                document.getElementById('procCount').textContent = '0';
                return;
            }
            var html = '';
            data.forEach(function(p, idx) {
                var bgColor = (idx % 2 === 0) ? '#ffffff' : '#f8f9fc';
                var cpuColor = p.cpu_percent > 50 ? '#f44336' : p.cpu_percent > 20 ? '#ff9800' : '#4caf50';
                var memColor = p.mem_percent > 50 ? '#f44336' : p.mem_percent > 20 ? '#ff9800' : '#4caf50';
                html += '<tr style="background:' + bgColor + ';">' +
                    '<td style="padding:8px 12px;font-family:monospace;font-weight:600;color:#333;">' + p.pid + '</td>' +
                    '<td style="padding:8px 12px;" title="' + (p.cmdline || p.name) + '">' + p.name + '</td>' +
                    '<td style="padding:8px 12px;text-align:right;font-family:monospace;font-weight:500;">' + p.rss_mb.toFixed(1) + '</td>' +
                    '<td style="padding:8px 12px;text-align:right;font-family:monospace;font-weight:500;color:' + cpuColor + ';">' + p.cpu_percent.toFixed(1) + '%</td>' +
                    '<td style="padding:8px 12px;text-align:right;font-family:monospace;font-weight:500;color:' + memColor + ';">' + p.mem_percent.toFixed(1) + '%</td>' +
                    '<td style="padding:6px 12px;text-align:center;">' +
                        '<button onclick="window.killProcess(' + p.pid + ')" style="background:#f44336;color:#fff;border:none;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:12px;margin-right:4px;">关闭</button>' +
                        '<button onclick="window.restartProcess(' + p.pid + ')" style="background:#4caf50;color:#fff;border:none;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:12px;">重启</button>' +
                    '</td></tr>';
            });
            tbody.innerHTML = html;
            document.getElementById('procCount').textContent = data.length;
        } catch(e) {
            tbody.innerHTML = '<tr><td colspan="6" style="padding:30px;text-align:center;color:#f44336;">❌ 解析失败<br><pre style="text-align:left;background:#1e1e1e;color:#d4d4d4;padding:10px;border-radius:4px;font-size:12px;max-height:150px;overflow:auto;white-space:pre-wrap;">' + rawOutput.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</pre></td></tr>';
        }
    })
    .catch(function(e) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:30px;text-align:center;color:#f44336;">❌ 请求失败: ' + e.message + '</td></tr>';
    });
};
window.killProcess = function(pid) {
    if (!confirm('确定终止进程 PID: ' + pid + ' 吗？')) return;
    var btns = document.querySelectorAll('#procTableBody button');
    btns.forEach(function(b) { b.disabled = true; });
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: 'process_manager.py', args: ['--kill', pid] })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        alert(d.output || '执行完成');
        window.loadProcess('rss_mb');
    })
    .catch(function(e) {
        alert('❌ 失败: ' + e.message);
        window.loadProcess('rss_mb');
    });
};
window.restartProcess = function(pid) {
    if (!confirm('确定重启进程 PID: ' + pid + ' 吗？')) return;
    var btns = document.querySelectorAll('#procTableBody button');
    btns.forEach(function(b) { b.disabled = true; });
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: 'process_manager.py', args: ['--restart', pid] })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
        alert(d.output || '执行完成');
        window.loadProcess('rss_mb');
    })
    .catch(function(e) {
        alert('❌ 失败: ' + e.message);
        window.loadProcess('rss_mb');
    });
};
</script>
