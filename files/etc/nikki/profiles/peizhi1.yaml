# ==============================
# 分流策略组
# ==============================
proxy-groups:
  # 自动选延迟最低节点
  - name: 不限量合集
    type: url-test                                                  # 测速
    url: http://www.gstatic.com/generate_204     # 测速目标地址
    interval: 300                                                  # 测速间隔秒
    timeout: 5000                                               # 单次测速超时5秒（和max-delay配合）
    max-delay: 3000                                          # 超过3秒直接淘汰，快节点优先、慢节点不堆
    tolerance: 200                                             # 优选节点不切换最低延迟
    lazy: true                                                    # 无流量时不测速
    exclude-filter: "(到期|过期|试用|测试|体验|剩余|邀请|http|客户端|导航|中国)"                     # 不使用节点词汇    
    use:
      - 不限量机场
      - 不限量机场2
      - 不限量机场3


  # 故障备用节点
  - name: 限量兜底
    type: url-test                                                    # 测速
    url: http://www.gstatic.com/generate_204       # 测速目标地址
    interval: 300                                                    # 测速间隔秒
    timeout: 5000                                                 # 单次测速超时5秒（和max-delay配合）
    max-delay: 3000                                            # 超过3秒直接淘汰，快节点优先、慢节点不堆
    tolerance: 200                                               # 优选节点不切换最低延迟
    lazy: true                                                      # 无流量时不测速
    exclude-filter: "(到期|过期|试用|测试|体验|剩余|邀请|http|客户端|导航|中国)"                     # 不使用节点词汇    
    use:
      - 限量机场

  # 代理组：故障自动切换备用
  - name: ProxyGroup
    type: fallback
    proxies:
      - 不限量合集
      - 限量兜底
    interval: 180                                     # 检测连通间隔秒
    idle-timeout: 20                                  # 超时条件秒
    client-fingerprint: chrome                        # 模拟浏览器请求指纹，降低风控


  # 外网专用分组：手动选择代理/直连
  - name: PROXY
    type: select
    proxies:
      - ProxyGroup  # 默认走代理组   
      - DIRECT      # 需要时手动切直连
      - REJECT      # 需要时手动切禁止

  # 国内站点分组：手动选择直连/代理
  - name: DOMESTIC
    type: select
    proxies:
      - DIRECT      # 需要时手动切直连
      - PROXY       # 需要时手动切代理
      - REJECT      # 需要时手动切禁止
   
# ==============================
# DNS 域名解析配置 【核心】
# ==============================
dns:
  enable: true
  ipv6: true
  prefer-ipv6: true   #优先解析ipv6  
# ==============================
# dns防污染模式模式
# 用处：解决dns污染 解决访问国内网站出现跳转江苏反诈平台 出现多人举报禁止访问页面
# 缺点：全局dns监听会导致游戏延迟增加2ms左右 注重游戏关闭 注重网页开启
# 此处为解决多网站在此处设置 一劳永逸 只想解决单网站建议在370行nameserver-policy中单独加域名+解析ip解决
# listen: 127.0.0.1:53行取消注释开启dns防污染  注释掉关闭dns防污染
# 注意删除注释后listen 的首字母l需要跟下面ipv6的i在同一列 不能往前往后移动位置
# ==============================
#  listen: 127.0.0.1:53       #注释掉为关闭 53监听 
  listen: '[::]:1053'         #混入设置代理设置ipv4 ipv6监听禁止取消勾选 将53端口转发至1053端口 
  prefer-h3: true             # DoH 优先 HTTP/3
# ==============================
# 网站解析方法 
# 开启fakeip模式取消注释即可          慢但准确
# 开启Mixed模式启用注释即可           两者兼顾 
# 开启redir-host DNS模式 全部注释   快但可能漏 
# 当前为fakeip DNS模式
# ==============================
  enhanced-mode: fake-ip       # 开启Fake-IP 防DNS劫持+拦截广告
  fake-ip-range: 198.18.0.1/16 # 虚拟IP网段，固定不用改
  fake-ip-range6: fdfe:dcba:9876::1/64  # 虚拟IP网段，固定不用改  
# ==============================
# enhanced-mode: mixed          # 开启mixed模式 防DNS劫持+拦截广告
# fake-ip-range: 198.18.0.0/16  # 虚拟IP网段，固定不用改
# ==============================
#  enhanced-mode: redir-host     # 开启redir模式 dns最低防护延迟最低
# ==============================  
# dns缓存 
  cache-size: 2000        # 最多存2000条域名解析记录
  cache-expire: 1800       # 缓存有效期 30分钟（单位：秒）
  cache-algorithm: arc     # 最优缓存淘汰算法（自动清老记录，推荐）
  dns-preload: true         # 域名预解析缓存
# ==============================
  # 切换为白名单模式/黑名单 白名单为写了的走虚拟ip  黑名单为不写的走虚拟ip  走虚拟ip才拿实现精准不漏的分流 
  fake-ip-filter-mode: whitelist          # 切换为虚拟ip白名单   列表内的走虚拟ip 
  #  fake-ip-filter-mode: blacklist       # 切换为虚拟ip黑名单   列表内的不走虚拟ip
  # 虚拟ip白/黑名单 黑名单为不写的走虚拟ip  走虚拟ip才拿实现精准不漏的分流 
  fake-ip-filter:
    - "geosite:gfw"                           # 国外网络走虚拟ip
    - "geosite:category-entertainment-cn"     # 国内娱乐
    - "geosite:category-wiki-cn"              # 国内百科
    - "geosite:category-speedtest"            # 测速网站
    - "geosite:category-social-media-cn"      # 国内社交媒体
    - "geosite:category-netdisk-cn"           # 国内网盘
    - "geosite:category-mobile-repair"        # 手机维修/服务
    - "geosite:category-food-cn"              # 国内美食/外卖
    - "geosite:category-electronic-cn"        # 国内电商/数码
    - "geosite:category-companies"            # 企业官网
    - "geosite:category-automobile-cn"        # 国内汽车
    - "geosite:category-ai-cn"                # 国内AI服务
    - "geosite:category-android-app-download" # 应用下载
    - "geosite:category-cdn-cn"               # 国内CDN
    - "geosite:category-forums"               # 国内论坛
    - "geosite:category-logistics-cn"         # 国内物流
    - "geosite:category-web-archive"          # 网络存档    
  # 开启/关闭Geosite启动全量预加载（解决重启CPU/内存爆满）
  # 优点：重启不卡、不爆内存、低负载运行
  # 缺点：首次访问国内域名极轻微延迟，二次访问恢复极速
  # true为开机一次性把所有 geosite 域名库全加载进内存
  geosite-preload: true

  # 默认国内DNS
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 日常解析使用国内DNS
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 国外域名备用DNS
  fallback:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query
    - 8.8.8.8          # 备用纯IP DNS，更稳定
    - 1.1.1.1
  # 国内IP强制走国内DNS
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/12
    check: true  #解析失败自动切境外DNS，解决国内被墙/污染域名

  # ==============================================
  # 【Fake-IP-DNS解析白名单】
  # 作用：域名不走虚拟假IP，强制真实DNS解析
  # 解决网站跳转反诈网站 跳转被多人举报页面问题
  # 需要与380行rules白名单配合使用
  # 解决开C后网站打不开、解析失败问题
  # 新增打不开的域名直接在这里添加
  # ==============================================
  nameserver-policy:
    # 苹果全套走国内解析    
    "geosite:apple-cn": [223.5.5.5, 119.29.29.29]   
    # 腾讯全系游戏专属国内纯净DNS
    "geosite:tencent": [223.5.5.5, 119.29.29.29]
    # Steam平台全系走国内DNS解析
    "geosite:steam": [223.5.5.5, 119.29.29.29]
    # 游戏走国内解析       
    "geosite:category-games": [223.5.5.5, 119.29.29.29]
    # 国服游戏加速器/更新/下载 直连国内DNS
    "geosite:category-game-accelerator-cn": [223.5.5.5, 119.29.29.29]
    # 游戏下载 直连国内DNS
    "geosite:category-game-platforms-download": [223.5.5.5, 119.29.29.29]
    # ==================== 国外全站 防污染 DNS ====================
    # Telegram全系防污染
    "geosite:telegram": ["https://cloudflare-dns.com/dns-query","https://dns.google/dns-query"]
    # GitHub全系解决时好时坏DNS污染
    "geosite:github": ["https://dns.google/dns-query", "https://cloudflare-dns.com/dns-query"]
    # Google全家防污染
    "geosite:google": ["https://dns.google/dns-query", "https://cloudflare-dns.com/dns-query"]
    # YouTube 全套强制境外DoH 稳出IPv6
    "geosite:youtube": ["https://dns.google/dns-query","https://cloudflare-dns.com/dns-query"]
    # Facebook/Instagram 全系强制境外 DoH 拿 IPv6
    "geosite:meta": ["https://dns.google/dns-query","https://cloudflare-dns.com/dns-query"]
    # TikTok养号 → 强制走代理DNS
    "geosite:tiktok": "proxy"
# ==============================
    # 兜底备用，万一有漏网的海外域名
    "geosite:china-list": [223.5.5.5, 119.29.29.29]
    "geosite:geolocation-!cn": ["https://cloudflare-dns.com/dns-query","https://dns.google/dns-query"]
# ==============================
    # 自定义白名单站点强制解析指定ip
    # 格式示例 前面网址 后面解析ip
    # "xxx.com": [223.5.5.5, 119.29.29.29]
    # "*.xxx.com": [223.5.5.5, 119.29.29.29]
# ==============================
    # 自用dns解析白名单
    "ipin.io": [223.5.5.5, 119.29.29.29]
    "*.ipin.io": [223.5.5.5, 119.29.29.29]
