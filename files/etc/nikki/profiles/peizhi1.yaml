# ==============================
# 最终分流执行顺序规则
# ==============================================
# 【rules路由强制白名单】
# 作用：强制该域名全程直连，不走任何代理
# 和上面DNS白名单搭配使用，完美兼容Fake-IP
# ==============================================
rules:
# ==============================================
 #【忽略广告网站域名白名单】         不想网站过滤广告加这里
 # - DOMAIN等于单独一个完整域名 DOMAIN-SUFFIX等于后缀域名
 # 自用
  - DOMAIN,dc.sigmob.cn,DOMESTIC         # 单独允许一个广告 看广告领取会员用的  
  - IP-CIDR,192.168.1.2/32,DIRECT,no-resolve
# ==============================================
#  系统规则 分流顺序从上往下依次判断
# ==============================================
  - GEOSITE,private,DIRECT               # 内网地址直连
  - GEOIP,private,DIRECT,no-resolve      # 局域网IP直连
  - DOMAIN-SUFFIX,lan,DIRECT             # 系统网络禁止代理
  - DOMAIN-SUFFIX,local,DIRECT           # 系统网络禁止代理
  - GEOSITE,category-ads-all,REJECT      # 全局所有广告域名统一拦截屏蔽
# ==============================================  
 #【手动白名单网站】不想网站走代理/强制走代理加这里
