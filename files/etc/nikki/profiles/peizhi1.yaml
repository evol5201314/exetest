  - DOMAIN-SUFFIX,steampowered.com,PROXY         # steam商店代理
  - DOMAIN-SUFFIX,steamcommunity.com,PROXY       # steam社区代理
  - DOMAIN-SUFFIX,ipin.io,DOMESTIC               # ip网站直连防污染
