# 游戏大陆节点直连 用户组
  - GEOSITE,steam@cn,DOMESTIC                                # steam直连
  - GEOSITE,category-games,DOMESTIC                          # 游戏直连  
  - GEOSITE,category-games@cn,DOMESTIC                       # 游戏直连
  - GEOSITE,category-game-accelerator-cn,DOMESTIC            # 加速器直连
  - GEOSITE,category-game-platforms-download,DOMESTIC        # 游戏下载直连
# ==============================================
  # 国内专属域名直连 系统组
  - GEOSITE,apple-cn,DOMESTIC              # 苹果直连
  - GEOSITE,google-cn,DOMESTIC             # 谷歌国内直连
  - GEOSITE,win-update,DOMESTIC            # Windows 更新直连
  - GEOSITE,onedrive,DOMESTIC              # OneDrive国内服务走国内分组
  - GEOSITE,microsoft@cn,DOMESTIC          # 微软国内服务走国内分组
# ==============================================
  - GEOSITE,china-list,DOMESTIC            #系统组 所有可识别大陆域名，统一归入国内分组               
# ==============================================  
  # 国外专属域名直连 用户组
  - GEOSITE,category-scholar-!cn,PROXY     # 海外学术科研类域名全部走代理
# ==============================================  
  - GEOSITE,gfw,PROXY                       #系统组 仅代理常用国外网站    
#  - GEOSITE,geolocation-!cn,PROXY          #系统组 非大陆通用境外域名统一全代理
# ==============================================
# IP精准分流
  - GEOIP,private,DIRECT,no-resolve         # 私有内网IP直连
  - GEOIP,telegram,PROXY                    # TG专属IP强制代理
#  - GEOIP,JP,PROXY                         # 日本IP走代理
  - GEOIP,CN,DOMESTIC                       # 中国大陆IP → 国内组
#  - GEOIP,!CN,PROXY                        # 境外IP → 代理组  
routing:
  complete-fallback: false       # 强制遍历完所有规则条目，命中规则停止
  default-action: DOMESTIC       # 无匹配规则流量默认优先本地直连
  default-proxy: PROXY           # 直连访问失败自动切换至外网代理组
