# ==============================
# 日常模式 
# ==============================
#  Nikki 完整配置 开启ipv6+广告过滤+故障转移+多机场+tun nat优化联机游戏体验
# 出现网站不能访问未被代理请在360行rules加上该网址
# 出现网站跳转反诈宣传禁止访问/dns污染请在180行设置
# 当前fakeip已关闭 启用mixed模式 如需开启 190行开启即可 mixed优点 解析速度更快
# 规则外流量全部直连，游戏/本地软件不受影响
# tun游戏模式减少460 丢包 游戏里瞬移、技能放不出来、卡顿判定 在50行开启
# ==============================

# 混合代理端口 HTTP/SOCKS5 共用端口
mixed-port: 7890
# 允许局域网其他设备使用代理
allow-lan: true
# 监听本机所有网卡IP
bind-address: 0.0.0.0
# 运行模式：按规则分流
mode: rule
# 启用geoip/geosite数据库模式 false为使用新版meatb数据库
geodata-mode: true
geo-auto-update: true       # 开启地理库自动更新
geo-update-interval: 23    # 更新周期，单位小时，23小时轮询一次
# 日志级别 error只输出错误，干净不刷屏
log-level: error
# 开启IPv6支持
ipv6: true
# 开启UDP转发(游戏/语音/流媒体必备)
udp: true
# 域名匹配严格模式
find-process-mode: off
# TCP长连接保活间隔
keep-alive: true
keep-alive-interval: 30

# 开启规则内存缓存，加快分流速度，减少重复联网
rule-cache: true

# 规则订阅走代理拉取，不直连，确保规则正常更新
profile:
  rule-providers-direct: false        # 保留，兼容OpenClash


# 开启TUN模式(不用全局劫持，避免游戏乱跑代理)  关闭游戏模式时到180行关闭fakeip 开启redir 模式
tun:
  enable: true                       # 必须开启：用于识别进程名
  stack: system                      # 使用系统网络栈：最轻量、0额外延迟
# stack: gvisor                      # 核心：用户态独立栈，抗丢包强 游戏460切换这个模式 缺点增加延迟3-5ms
  auto-route: false                   # 最核心：false不修改系统路由 → 不走TUN的流量完全裸连，0延迟 /全局流量过虚拟网卡 游戏抗丢包必须true 日常不玩游戏可以false
# 只玩国内游戏 可设置flase 搭配syestem栈 国内游戏原生延迟  tun功能相当于无效 玩国外游戏 必须设置flase 且fakeip白名单 把游戏放进虚拟ip 改为黑名单模式 
  auto-detect-interface: false       # false关闭自动网卡扫描：省掉0.1ms后台CPU开销，极致稳定  /自动识别多网卡
# dns-hijack: [any:53, tcp://any:53] # 关闭DNS劫持：留空彻底去掉1~3ms解析延迟，回归原生DNS  /强制劫持所有DNS请求（防泄漏）
  dns-hijack: []                     # 开全局监听 route  接口需设置53any53  不开route的话 留空 二选一注释 route跟hijack一般搭配使用 开全局写接口 不开全局不写接口
  route-exclude-address:
    - 192.168.1.213/32               # 排除米家设备进tun  
# 排除底层/内网IPv6，解决TUN路由冲突、防止公网v6断流/切v4
  inet6-route-exclude-address:
    - fe80::/10   # 网卡链路本地地址，保障底层通信
    - ::1/128     # 本机IPv6回环地址
    - fc00::/7    # 内网ULA，留=内网快；删=内网走TUN变慢 公网根本没有 fc00::/7 的网站，全世界公网路由都不播这段，ISP 也会过滤
  
# 网页控制后台地址+密码
# 192.168.1.2:9090
external-controller: 0.0.0.0:9090
secret: "998613"
redir-port: 7891
unified-delay: true
