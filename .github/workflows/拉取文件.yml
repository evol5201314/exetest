name: 一键同步

on:
  workflow_dispatch

env:
  # ============================================================
  # 👇 所有配置都在这里，修改这5个变量即可
  # ============================================================
  # 源仓库（项目 A）完整URL: https://github.com/evol5201314/openwrt-nikki-rax3000m/tree/25.12.15/files/etc
  SOURCE_REPO: "evol5201314/openwrt-nikki-rax3000m"   # 从URL中提取 owner/repo
  SOURCE_REF: "25.12.15"                              # 分支或标签
  SOURCE_PATH: "files/etc"                            # 要同步的源目录

  # 目标仓库（项目 B）完整URL: https://github.com/evol5201314/exetest (不需要分支和路径，因为就是当前仓库)
  TARGET_REPO: "evol5201314/exetest"                  # 目标仓库 owner/repo
  TARGET_PATH: "files/etc"                            # 目标存放目录（通常与源相同）
  # ============================================================

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出目标仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target

      - name: 检出源仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - name: 复制文件（默认覆盖，如需跳过已有文件，将 cp -rf 改为 cp -rn）
        run: |
          mkdir -p target/${{ env.TARGET_PATH }}
          cp -rf source/${{ env.SOURCE_PATH }}/* target/${{ env.TARGET_PATH }}/

      - name: 提交并推送
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "同步上游 ${{ env.SOURCE_PATH }}"
          git push
