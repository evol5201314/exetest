name: 一键同步

on:
  workflow_dispatch

permissions:
  contents: write

env:
  # =========================================================================
  # 所有配置集中在这里，修改这 5 个变量即可（其他不用动）
  # =========================================================================
  #
  # 【项目 A - 源仓库】
  # 完整 URL: https://github.com/evol5201314/openwrt-nikki-rax3000m/tree/25.12.15/files/etc
  SOURCE_REPO: "evol5201314/openwrt-nikki-rax3000m"
  SOURCE_REF: "25.12.15"
  SOURCE_PATH: "files/etc"

  # 【项目 B - 目标仓库】
  # 完整 URL: https://github.com/evol5201314/exetest
  TARGET_REPO: "evol5201314/exetest"
  TARGET_PATH: "files/etc"
  # =========================================================================

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出目标仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target

      - name: 检出源仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source

      - name: 复制文件（默认强制覆盖）
        run: |
          mkdir -p target/${{ env.TARGET_PATH }}
          cp -rf source/${{ env.SOURCE_PATH }}/* target/${{ env.TARGET_PATH }}/

      - name: 提交并推送
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "同步上游 ${{ env.SOURCE_PATH }}"
          git push
