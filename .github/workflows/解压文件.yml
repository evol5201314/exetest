name: 解压仓库内的 zip
on:
  workflow_dispatch
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解压 tmp.zip 到根目录（生成单个 tmp 文件夹）
        run: |
          set -eux
          # 如果有旧的 tmp 目录，先删除（避免冲突）
          rm -rf tmp
          # 解压到当前目录，zip 内部的 tmp/ 会出现在根目录
          unzip -o tmp.zip -d .
          # 删除原 zip 文件（强制删除，避免静默失败）
          rm -f tmp.zip

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 暂存所有变更：新增的 tmp 目录 + 删除的 tmp.zip 文件
          git add -A
          # 无变更则跳过提交，有变更则提交
          git diff --staged --quiet || git commit -m "解压 tmp.zip 到 tmp 目录并移除原压缩包"
          git push
