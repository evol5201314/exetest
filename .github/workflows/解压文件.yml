name: 解压仓库内的 zip
on:
  workflow_dispatch
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解压 tmp.zip（解决中文文件名乱码）
        run: |
          set -eux
          # 清理旧的 tmp 目录，避免冲突
          rm -rf tmp
          # 安装 7-Zip 工具
          sudo apt-get update && sudo apt-get install -y p7zip-full
          # 强制以 GBK 编码解压，匹配 Windows 打包的 zip
          7z x -scsGBK tmp.zip -o.
          # 删除原 zip 文件
          rm -f tmp.zip

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 暂存所有变更：新增的 tmp 目录 + 删除的 tmp.zip
          git add -A
          # 无变更则跳过提交，有变更则提交
          git diff --staged --quiet || git commit -m "解压 tmp.zip 到 tmp 目录并移除原压缩包"
          git push
