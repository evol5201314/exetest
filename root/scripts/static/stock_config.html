<div class="modal active" id="stockConfigModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;">
<div class="modal-box" style="max-width:720px;width:94%;background:#ffffff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,0.15);padding:16px;box-sizing:border-box;max-height:85vh;overflow-y:auto;">
<span class="close" onclick="window.closeStockModal()" style="float:right;font-size:22px;cursor:pointer;color:#999;line-height:14px;margin:-4px -4px 4px 0;transition:color 0.2s;">×</span>
<h2 style="margin:0 0 4px 0;font-size:17px;color:#222;">📈 行情参数修改</h2>
<p style="font-size:12px;color:#777;margin:0 0 14px 0;">修改后点击保存，下次运行监控脚本生效。</p>
<div style="margin-bottom:10px;display:flex;align-items:center;gap:10px;">
    <label style="font-size:14px;color:#333;font-weight:500;">开启消息推送</label>
    <input type="checkbox" id="cfg_push_enable" style="width:18px;height:18px;cursor:pointer;">
</div>
<div style="margin-bottom:10px;display:flex;align-items:center;gap:10px;">
    <label style="font-size:14px;color:#333;font-weight:500;">调试输出(VERBOSE_LOG)</label>
    <input type="checkbox" id="cfg_verbose_log" style="width:18px;height:18px;cursor:pointer;">
    <span style="font-size:12px;color:#777;">开启打印日志；关闭完全静默无输出</span>
</div>
<div style="margin-bottom:14px;">
    <label style="display:block;margin-bottom:5px;font-size:14px;color:#333;font-weight:500;">Push Plus Token</label>
    <input type="text" id="cfg_push_token" style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #ddd;border-radius:7px;font-size:14px;outline:none;transition:border 0.2s;" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#ddd'">
</div>
<!-- 按钮改为左对齐 -->
<div style="margin-bottom:16px;display:flex;gap:10px;">
<button id="btn_manual_push" onclick="window.manualPushStock()" style="padding:8px 18px;border:none;border-radius:18px;cursor:pointer;font-size:14px;font-weight:500;background:#2196F3;color:#fff;box-shadow:0 4px 12px rgba(33,150,243,0.3);">📤手动推送快照</button>
<button id="btn_save_stock" onclick="window.saveStockConfig()" style="padding:8px 24px;border:none;border-radius:18px;cursor:pointer;font-size:14px;font-weight:500;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;transition:opacity 0.2s;box-shadow:0 4px 12px rgba(102,126,234,0.3);">💾 保存所有参数</button>
</div>
<h3 style="border-left:4px solid #667eea;padding:4px 0 4px 10px;color:#222;font-size:14px;margin:16px 0 8px 0;background:#f7f8ff;border-radius:0 7px 7px 0;">📊 股票监控</h3>
<div id="stock_table"></div>
<h3 style="border-left:4px solid #f44336;padding:4px 0 4px 10px;color:#222;font-size:14px;margin:16px 0 8px 0;background:#fff7f7;border-radius:0 7px 7px 0;">🇺🇸 美股监控</h3>
<div id="us_table"></div>
<h3 style="border-left:4px solid #4caf50;padding:4px 0 4px 10px;color:#222;font-size:14px;margin:16px 0 8px 0;background:#f7fff8;border-radius:0 7px 7px 0;">🪙 虚拟币监控</h3>
<div id="crypto_table"></div>
</div>
</div>
<style>
/* 去掉number输入框上下箭头 */
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type=number] {
  -moz-appearance:textfield;
}
.stock-row:hover input{
  background-color:#fafafa !important;
}
</style>
<script>
function renderTable(prefix, containerId) {
    var cols = (prefix === 'us') ? 5 : 4;
    var headers = (prefix === 'us')
        ? '<div style="padding:6px 5px;">雅虎代码</div><div style="padding:6px 5px;">国内备用(腾讯)</div><div style="padding:6px 5px;">低于报警</div><div style="padding:6px 5px;">高于报警</div><div style="padding:6px 5px;">当前价位</div>'
        : '<div style="padding:6px 5px;">代码</div><div style="padding:6px 5px;">低于报警</div><div style="padding:6px 5px;">高于报警</div><div style="padding:6px 5px;">当前价位</div>';
    var gridCols = (prefix === 'us') ? '1.5fr 1.5fr 1fr 1fr 1fr' : '2fr 1fr 1fr 1fr';
    var html = `<div style="display:grid;grid-template-columns:${gridCols};gap:4px;background:#f1f3f9;border-radius:8px;font-weight:600;color:#333;margin-bottom:4px;">${headers}</div>`;
    for (var i = 0; i < 10; i++) {
        var rowHtml = '';
        var inputStyle = "box-sizing:border-box;width:100%;padding:6px 8px;border:1px solid #e2e2e2;border-radius:6px;font-size:13px;outline:none;transition:border 0.2s;";
        if (prefix === 'us') {
            rowHtml += `<input type="text" id="us_code_${i}" placeholder="雅虎代码" style="${inputStyle}" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e2e2e2'">`;
            rowHtml += `<input type="text" id="us_alt_${i}" placeholder="备用代码" style="${inputStyle}" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e2e2e2'">`;
            rowHtml += `<input type="number" id="us_low_${i}" placeholder="低于" style="${inputStyle}" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e2e2e2'">`;
            rowHtml += `<input type="number" id="us_high_${i}" placeholder="高于" style="${inputStyle}" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e2e2e2'">`;
            rowHtml += `<input type="text" id="us_price_${i}" readonly style="${inputStyle}background:#f5f6f8;color:#555;">`;
        } else {
            rowHtml += `<input type="text" id="${prefix}_code_${i}" placeholder="输入代码" style="${inputStyle}" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e2e2e2'">`;
            rowHtml += `<input type="number" id="${prefix}_low_${i}" placeholder="低于" style="${inputStyle}" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e2e2e2'">`;
            rowHtml += `<input type="number" id="${prefix}_high_${i}" placeholder="高于" style="${inputStyle}" onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e2e2e2'">`;
            rowHtml += `<input type="text" id="${prefix}_price_${i}" readonly style="${inputStyle}background:#f5f6f8;color:#555;">`;
        }
        html += `<div class="stock-row" style="display:grid;grid-template-columns:${gridCols};gap:4px;margin-bottom:2px;">${rowHtml}</div>`;
    }
    document.getElementById(containerId).innerHTML = html;
}
window.init_stockConfigModal = function() {
    renderTable('stock', 'stock_table');
    renderTable('us', 'us_table');
    renderTable('crypto', 'crypto_table');
    fetch('/api/run_tool', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ script: 'monitor_stock.py', args: ['--get'] }) })
    .then(r => r.json()).then(d => {
        if (d.output) {
            try {
                var cfg = JSON.parse(d.output);
                document.getElementById('cfg_push_token').value = cfg.PUSH_TOKEN || '';
                document.getElementById('cfg_push_enable').checked = !!cfg.PUSH_ENABLE;
                document.getElementById('cfg_verbose_log').checked = !!cfg.VERBOSE_LOG;
                for (var i = 0; i < 10; i++) {
                    if (cfg.STOCK_CONFIG && cfg.STOCK_CONFIG[i]) {
                        document.getElementById(`stock_code_${i}`).value = cfg.STOCK_CONFIG[i][0] || '';
                        document.getElementById(`stock_low_${i}`).value = cfg.STOCK_CONFIG[i][1] > 0 ? cfg.STOCK_CONFIG[i][1] : '';
                        document.getElementById(`stock_high_${i}`).value = cfg.STOCK_CONFIG[i][2] > 0 ? cfg.STOCK_CONFIG[i][2] : '';
                    }
                }
                for (var i = 0; i < 10; i++) {
                    if (cfg.US_CONFIG && cfg.US_CONFIG[i]) {
                        document.getElementById(`us_code_${i}`).value = cfg.US_CONFIG[i][0] || '';
                        document.getElementById(`us_alt_${i}`).value = cfg.US_CONFIG[i][1] || '';
                        document.getElementById(`us_low_${i}`).value = cfg.US_CONFIG[i][2] > 0 ? cfg.US_CONFIG[i][2] : '';
                        document.getElementById(`us_high_${i}`).value = cfg.US_CONFIG[i][3] > 0 ? cfg.US_CONFIG[i][3] : '';
                    }
                }
                for (var i = 0; i < 10; i++) {
                    if (cfg.CRYPTO_CONFIG && cfg.CRYPTO_CONFIG[i]) {
                        document.getElementById(`crypto_code_${i}`).value = cfg.CRYPTO_CONFIG[i][0] || '';
                        document.getElementById(`crypto_low_${i}`).value = cfg.CRYPTO_CONFIG[i][1] > 0 ? cfg.CRYPTO_CONFIG[i][1] : '';
                        document.getElementById(`crypto_high_${i}`).value = cfg.CRYPTO_CONFIG[i][2] > 0 ? cfg.CRYPTO_CONFIG[i][2] : '';
                    }
                }
            } catch(e) { console.log(e); }
        }
    });
    fetch('/api/run_tool', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ script: 'monitor_stock.py', args: ['--get-price'] }) })
    .then(r => r.json()).then(d => {
        if (d.output) {
            try {
                var prices = JSON.parse(d.output);
                for (var i = 0; i < 10; i++) {
                    var code = document.getElementById(`stock_code_${i}`).value;
                    if (code) document.getElementById(`stock_price_${i}`).value = prices.stocks[code] || "查无";
                    var uc = document.getElementById(`us_code_${i}`).value;
                    if (uc) document.getElementById(`us_price_${i}`).value = prices.us[uc] || "查无";
                    var cc = document.getElementById(`crypto_code_${i}`).value;
                    if (cc) document.getElementById(`crypto_price_${i}`).value = prices.crypto[cc] || "查无";
                }
            } catch(e) { console.log(e); }
        }
    }).catch(e => console.log(e));
};
// 手动推送：不等待后端执行完成，提交后立刻提示，后台继续跑脚本
window.manualPushStock = function(){
    fetch('/api/run_tool', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({script:'monitor_stock.py',args:['--manual-push']})
    });
    alert("✅已触发手动推送，后台执行，结果请查看服务端日志");
}
window.closeStockModal = function() { document.getElementById('stockConfigModal').style.display = 'none'; };
window.saveStockConfig = function() {
    var s = [], u = [], c = [];
    for (var i=0; i<10; i++) { s.push([document.getElementById(`stock_code_${i}`).value.trim(), document.getElementById(`stock_low_${i}`).value||0, document.getElementById(`stock_high_${i}`).value||0]); }
    for (var i=0; i<10; i++) { u.push([document.getElementById(`us_code_${i}`).value.trim(), document.getElementById(`us_alt_${i}`).value.trim(), document.getElementById(`us_low_${i}`).value||0, document.getElementById(`us_high_${i}`).value||0]); }
    for (var i=0; i<10; i++) { c.push([document.getElementById(`crypto_code_${i}`).value.trim(), document.getElementById(`crypto_low_${i}`).value||0, document.getElementById(`crypto_high_${i}`).value||0]); }
    var data = {
        "PUSH_ENABLE": document.getElementById("cfg_push_enable").checked,
        "VERBOSE_LOG": document.getElementById("cfg_verbose_log").checked,
        "PUSH_TOKEN": document.getElementById('cfg_push_token').value,
        "STOCK_CONFIG": s,
        "US_CONFIG": u,
        "CRYPTO_CONFIG": c
    };
    fetch('/api/run_tool', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ script: 'monitor_stock.py', args: ['--set', JSON.stringify(data)] }) })
    .then(r => r.json()).then(d => { alert(d.output || '保存成功'); window.closeStockModal(); });
};
</script>
