<script>
/*
================================================================
⚠️ ⚠️ ⚠️ 窗口创建逻辑与铁律（必读）⚠️ ⚠️ ⚠️
================================================================

【为什么 HTML 注释不能放在文件最前面？】
  如果本文件以 <!-- 注释 --> 开头，app.py 的 loadModal 解析时可能出错，
  导致所有弹窗无法显示。因此，所有说明必须写在 <script> 的 JS 注释中。

【通用弹窗创建流程】
  1. 在 tools/ 下的脚本前10行内添加 # popup: 弹窗ID (例如 # popup: myModal)
  2. 如果需要独立 HTML 文件，再加一行 # html: 文件名.html
     （文件必须放在 /root/scripts/static/ 下）
  3. 在本文件（或独立的 HTML 文件）中添加弹窗的 HTML 结构：
     <div class="modal active" id="myModal" style="display:none;">
       ...
     </div>
  4. 在本文件的 <script> 中（或独立文件的 <script> 中）添加业务函数，
     所有函数必须挂载到 window：
       window.init_myModal = function() { ... };
       window.myAction = function() { ... };
  5. 弹窗右上角的 X 按钮和底部的关闭按钮必须调用 window.closeModalByName('弹窗ID')
  6. 如果使用独立 HTML 文件，该文件中也需要定义 window.closeModalByName （或依赖主文件已加载的该函数）

【函数挂载铁律】
  - 所有需要被 HTML onclick 调用的函数，必须写成 window.xxx = function(){}
  - 初始化函数必须命名为 window.init_弹窗ID
  - 普通辅助函数（如 populateSelect）如果只在弹窗内部使用，可以不挂 window，
    但建议统一挂载以避免作用域问题。

【关闭按钮铁律】
  - 所有弹窗的关闭操作都必须通过 window.closeModalByName 或 window.closeProcModal 等全局关闭函数。
  - 关闭函数应只隐藏弹窗（el.style.display = 'none'），不要删除 DOM，
    否则再次打开时可能出错。
  - 如果需要在关闭时清空容器并重置 modalLoaded（如返回主界面），
    可以保留原有逻辑（container.innerHTML = ''; modalLoaded = false;），
    但必须确保后续打开能重新加载。

【独立 HTML 弹窗的使用】
  - 当脚本头部指定了 # html: 文件名.html 时，面板会加载 /static/ 下的该文件。
  - 独立文件只需包含一个弹窗的 HTML 和对应的 JS，无需包含其他弹窗。
  - 独立文件中的函数也必须挂载到 window。
  - 建议每个独立文件都定义自己的 window.closeModalByName （内容与主文件一致）。

【添加按钮】
  - 在脚本头部添加 # btn: 按钮文字, # group: script/router, # order: 数字,
    # action: runScript:脚本名.py (或 runTool:脚本名.py), # btn-class: 颜色类
  - app.py 会自动扫描并生成按钮，无需手动修改 app.py。

================================================================
*/


// ========== 通用弹窗关闭函数 ==========
window.closeModalByName = function(name) {
    var el = document.getElementById(name);
    if (el) {
        el.style.display = 'none';
    }
};

// ========== 新建脚本 ==========
window.createScript = function() {
    var name = document.getElementById('newName').value.trim();
    var content = document.getElementById('newContent').value;
    var type = document.getElementById('newFileType').value;
    if (!name) { alert('请输入文件名'); return; }
    if (!content) { alert('代码内容不能为空'); return; }
    doRunTool('new_script.py', ['--name', name, '--content', content, '--type', type], '📝 新建文件');
    window.closeModalByName('newModal');
};

// ========== 编辑脚本 ==========
window.init_editModal = function() { window.populateEditSelect(); };
window.populateEditSelect = function() {
    fetch('/api/scripts').then(r => r.json()).then(d => {
        var sel = document.getElementById('editSelect');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- 选择脚本 --</option>';
        if (d) d.forEach(function(s) { var opt = document.createElement('option'); opt.value = s.name; opt.textContent = s.name; sel.appendChild(opt); });
    }).catch(function() {});
};
window.loadEditContent = function() {
    var name = document.getElementById('editSelect').value;
    if (!name) return;
    fetch('/api/get/' + encodeURIComponent(name)).then(r => r.json()).then(d => {
        if (d.error) { alert(d.error); return; }
        document.getElementById('editContent').value = d.content || '';
        document.getElementById('editNewName').value = '';
    }).catch(function() {});
};
window.saveEdit = function() {
    var name = document.getElementById('editSelect').value;
    var content = document.getElementById('editContent').value;
    var newName = document.getElementById('editNewName').value.trim();
    if (!name) { alert('请选择脚本'); return; }
    if (!content) { alert('内容不能为空'); return; }
    var args = ['--name', name, '--content', content];
    if (newName) args.push('--newname', newName);
    doRunTool('edit_script.py', args, '✏️ 编辑脚本');
    window.closeModalByName('editModal');
};

// ========== 删除脚本 ==========
window.init_delModal = function() { window.populateDelSelect(); };
window.populateDelSelect = function() {
    fetch('/api/scripts').then(r => r.json()).then(d => {
        var sel = document.getElementById('delSelect');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- 选择脚本 --</option>';
        if (d) d.forEach(function(s) { var opt = document.createElement('option'); opt.value = s.name; opt.textContent = s.name; sel.appendChild(opt); });
    }).catch(function() {});
};
window.deleteScript = function() {
    var name = document.getElementById('delSelect').value;
    if (!name) { alert('请选择脚本'); return; }
    if (!confirm('确定删除 "' + name + '" 吗？')) return;
    doRunTool('delete_script.py', ['--name', name], '🗑 删除脚本');
    window.closeModalByName('delModal');
};

// ========== 上传脚本（修复中文问题） ==========
function base64Encode(str) {
    var bytes = [];
    for (var i = 0; i < str.length; i++) {
        var code = str.charCodeAt(i);
        if (code < 0x80) {
            bytes.push(code);
        } else if (code < 0x800) {
            bytes.push(0xc0 | (code >> 6), 0x80 | (code & 0x3f));
        } else if (code < 0x10000) {
            bytes.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
        } else {
            bytes.push(0xf0 | (code >> 18), 0x80 | ((code >> 12) & 0x3f), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
        }
    }
    var binary = '';
    bytes.forEach(function(b) { binary += String.fromCharCode(b); });
    return btoa(binary);
}

window.doUpload = function() {
    var input = document.getElementById('uploadFileInput');
    if (!input.files || !input.files.length) {
        alert('请选择文件');
        return;
    }
    var file = input.files[0];
    if (!file.name.endsWith('.py')) {
        alert('只支持 .py 文件');
        return;
    }
    var output = document.getElementById('uploadOutput');
    output.style.display = 'block';
    output.textContent = '⏳ 读取文件...';

    var reader = new FileReader();
    reader.onload = function(e) {
        // readAsDataURL 结果示例: "data:text/plain;base64,xxxx"
        var dataUrl = e.target.result;
        // 提取纯 base64 字符串（去掉前缀 "data:text/plain;base64,"）
        var base64 = dataUrl.split(',')[1];
        output.textContent = '⏳ 上传中...';
        fetch('/api/run_tool', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                script: 'upload_script.py',
                args: ['--filename', file.name, '--content', base64]
            })
        })
        .then(r => r.json())
        .then(d => {
            output.textContent = d.output || '执行完成';
            if (d.output && d.output.indexOf('✅') !== -1) {
                loadAll();
                input.value = '';
            }
        })
        .catch(e => {
            output.textContent = '❌ 上传失败: ' + e.message;
        });
    };
    reader.onerror = function() {
        output.textContent = '❌ 读取文件失败';
    };
    // 改用 readAsDataURL，不再使用 readAsText + 手动 base64
    reader.readAsDataURL(file);
};

window.clearCurrentLog = function() {
    var name = document.getElementById('logSelect').value;
    if (!name) return alert("请先选择对应脚本");
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            script: 'view_log.py',
            args: ['--clear', '--name', name]
        })
    }).then(function(r) {
        return r.json();
    }).then(function() {
        alert("当前脚本日志已清空");
        window.loadLog();
    })
};
window.clearAllLogs = function() {
    if (!confirm("确定清空所有脚本日志？操作不可恢复！")) return;
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            script: 'view_log.py',
            args: ['--clear-all']
        })
    }).then(function(r) {
        return r.json();
    }).then(function() {
        alert("全部日志清理完成");
        window.loadLog();
    })
};
// ========== 同步 GitHub ==========
window.init_syncModal = function() {
    window.loadSyncConfig();
};
window.loadSyncConfig = function() {
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            script: 'sync_github.py',
            args: ['--get-config']
        })
    })
    .then(function(res) {
        return res.json();
    })
    .then(function(data) {
        document.getElementById('syncRepoInput').value = data.output.trim();
    })
    .catch(function() {});
};
window.doSync = function() {
    var repo = document.getElementById('syncRepoInput').value.trim();
    if(!repo) return alert("请填写GitHub仓库地址");
    var outputDom = document.getElementById('syncOutput');
    outputDom.style.display = 'block';
    outputDom.textContent = "⏳ 正在同步仓库脚本...";
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            script: 'sync_github.py',
            args: ['--repo', repo]
        })
    })
    .then(function(res) {
        return res.json();
    })
    .then(function(data) {
        outputDom.textContent = data.output;
        if(data.output.indexOf("下载") > -1) {
            loadAll()
        }
    })
    .catch(function(err) {
        outputDom.textContent = "❌ 同步失败："+err.message;
    });
};
