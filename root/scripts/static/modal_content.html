</div>

<script>
/*
================================================================
⚠️ ⚠️ ⚠️ 窗口创建逻辑与铁律（必读）⚠️ ⚠️ ⚠️
================================================================
... （注释保留，与之前相同，此处省略以节约空间，实际文件请保留）
================================================================
*/

// ========== 通用弹窗关闭函数 ==========
window.closeModalByName = function(name) {
    var el = document.getElementById(name);
    if (el) {
        el.style.display = 'none';
    }
};

// ========== 新建脚本 ==========
window.createScript = function() {
    var name = document.getElementById('newName').value.trim();
    var content = document.getElementById('newContent').value;
    var type = document.getElementById('newFileType').value;
    if (!name) { alert('请输入文件名'); return; }
    if (!content) { alert('代码内容不能为空'); return; }
    doRunTool('new_script.py', ['--name', name, '--content', content, '--type', type], '📝 新建文件');
    window.closeModalByName('newModal');
};

// ========== 编辑脚本 ==========
window.init_editModal = function() { window.populateEditSelect(); };
window.populateEditSelect = function() {
    fetch('/api/scripts').then(r => r.json()).then(d => {
        var sel = document.getElementById('editSelect');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- 选择脚本 --</option>';
        if (d) d.forEach(function(s) { var opt = document.createElement('option'); opt.value = s.name; opt.textContent = s.name; sel.appendChild(opt); });
    }).catch(function() {});
};
window.loadEditContent = function() {
    var name = document.getElementById('editSelect').value;
    if (!name) return;
    fetch('/api/get/' + encodeURIComponent(name)).then(r => r.json()).then(d => {
        if (d.error) { alert(d.error); return; }
        document.getElementById('editContent').value = d.content || '';
        document.getElementById('editNewName').value = '';
    }).catch(function() {});
};
window.saveEdit = function() {
    var name = document.getElementById('editSelect').value;
    var content = document.getElementById('editContent').value;
    var newName = document.getElementById('editNewName').value.trim();
    if (!name) { alert('请选择脚本'); return; }
    if (!content) { alert('内容不能为空'); return; }
    var args = ['--name', name, '--content', content];
    if (newName) args.push('--newname', newName);
    doRunTool('edit_script.py', args, '✏️ 编辑脚本');
    window.closeModalByName('editModal');
};

// ========== 删除脚本 ==========
window.init_delModal = function() { window.populateDelSelect(); };
window.populateDelSelect = function() {
    fetch('/api/scripts').then(r => r.json()).then(d => {
        var sel = document.getElementById('delSelect');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- 选择脚本 --</option>';
        if (d) d.forEach(function(s) { var opt = document.createElement('option'); opt.value = s.name; opt.textContent = s.name; sel.appendChild(opt); });
    }).catch(function() {});
};
window.deleteScript = function() {
    var name = document.getElementById('delSelect').value;
    if (!name) { alert('请选择脚本'); return; }
    if (!confirm('确定删除 "' + name + '" 吗？')) return;
    doRunTool('delete_script.py', ['--name', name], '🗑 删除脚本');
    window.closeModalByName('delModal');
};

// ========== 上传脚本（修复中文问题） ==========
function base64Encode(str) {
    var bytes = [];
    for (var i = 0; i < str.length; i++) {
        var code = str.charCodeAt(i);
        if (code < 0x80) {
            bytes.push(code);
        } else if (code < 0x800) {
            bytes.push(0xc0 | (code >> 6), 0x80 | (code & 0x3f));
        } else if (code < 0x10000) {
            bytes.push(0xe0 | (code >> 12), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
        } else {
            bytes.push(0xf0 | (code >> 18), 0x80 | ((code >> 12) & 0x3f), 0x80 | ((code >> 6) & 0x3f), 0x80 | (code & 0x3f));
        }
    }
    var binary = '';
    bytes.forEach(function(b) { binary += String.fromCharCode(b); });
    return btoa(binary);
}

window.doUpload = function() {
    var input = document.getElementById('uploadFileInput');
    if (!input.files || !input.files.length) {
        alert('请选择文件');
        return;
    }
    var file = input.files[0];
    if (!file.name.endsWith('.py')) {
        alert('只支持 .py 文件');
        return;
    }
    var output = document.getElementById('uploadOutput');
    output.style.display = 'block';
    output.textContent = '⏳ 读取文件...';

    var reader = new FileReader();
    reader.onload = function(e) {
        // readAsDataURL 结果示例: "data:text/plain;base64,xxxx"
        var dataUrl = e.target.result;
        // 提取纯 base64 字符串（去掉前缀 "data:text/plain;base64,"）
        var base64 = dataUrl.split(',')[1];
        output.textContent = '⏳ 上传中...';
        fetch('/api/run_tool', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                script: 'upload_script.py',
                args: ['--filename', file.name, '--content', base64]
            })
        })
        .then(r => r.json())
        .then(d => {
            output.textContent = d.output || '执行完成';
            if (d.output && d.output.indexOf('✅') !== -1) {
                loadAll();
                input.value = '';
            }
        })
        .catch(e => {
            output.textContent = '❌ 上传失败: ' + e.message;
        });
    };
    reader.onerror = function() {
        output.textContent = '❌ 读取文件失败';
    };
    // 改用 readAsDataURL，不再使用 readAsText + 手动 base64
    reader.readAsDataURL(file);
};

// ========== 查看日志 ==========
window.init_logModal = function() { window.populateLogSelect(); };
window.populateLogSelect = function() {
    fetch('/api/run_tool', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ script: 'view_log.py', args: ['--list'] }) })
        .then(r => r.json()).then(d => {
            try {
                var list = JSON.parse(d.output);
                var sel = document.getElementById('logSelect');
                if (!sel) return;
                sel.innerHTML = '<option value="">📌 最新日志</option>';
                if (list && list.length) list.forEach(function(name) { var opt = document.createElement('option'); opt.value = name; opt.textContent = name; sel.appendChild(opt); });
                window.loadLog();
            } catch (e) {}
        }).catch(function() {});
};
window.loadLog = function() {
    var name = document.getElementById('logSelect').value;
    document.getElementById('logContent').textContent = '⏳ 加载中...';
    var args = name ? ['--name', name] : ['--latest'];
    fetch('/api/run_tool', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ script: 'view_log.py', args: args }) })
        .then(r => r.json()).then(d => { document.getElementById('logContent').textContent = d.output || '暂无输出'; })
        .catch(e => { document.getElementById('logContent').textContent = '❌ 加载失败: ' + e.message; });
};
window.clearCurrentLog = function() { /* ... 保持不变 ... */ };
window.clearAllLogs = function() { /* ... 保持不变 ... */ };

// ========== 同步 GitHub ==========
window.init_syncModal = function() { window.loadSyncConfig(); };
window.loadSyncConfig = function() { /* ... 保持不变 ... */ };
window.doSync = function() { /* ... 保持不变 ... */ };
</script>
