<!--
================================================================
⚠️ 通用弹窗规范 - 所有函数必须挂载到 window
================================================================
【加载流程】
  1. app.py 调用 loadModal('ID')
  2. fetch 本文件 -> HTML 放入 modalContainer
  3. eval 执行本文件全部 JS（函数挂载到 window）
  4. 自动调用 window.init_ID() 完成初始化
【新增弹窗步骤】
  1. 添加弹窗 HTML，ID 为 myModal
  2. 在 <script> 中添加 window.init_myModal = function(){ ... }
  3. 在 tools/ 的脚本中写入 # popup: myModal
  4. 无需修改 app.py
================================================================
-->

<!-- ==================== 所有业务函数挂载到 window ==================== -->
<script>
// ---------- 通用关闭函数 ----------
window.closeModalByName = function(name) {
    var el = document.getElementById(name);
    if (el) {
        el.style.display = 'none';
        var container = document.getElementById('modalContainer');
        if (container) container.innerHTML = '';
        window.modalLoaded = false;
    }
};

// ---------- 新建脚本 ----------
window.createScript = function() {
    var name = document.getElementById('newName').value.trim();
    var content = document.getElementById('newContent').value;
    if (!name) { alert('请输入文件名'); return; }
    if (!content) { alert('代码内容不能为空'); return; }
    doRunTool('new_script.py', ['--name', name, '--content', content], '📝 新建脚本');
    window.closeModalByName('newModal');
};

// ---------- 编辑脚本 ----------
window.init_editModal = function() {
    window.populateEditSelect();
};
window.populateEditSelect = function() {
    fetch('/api/scripts').then(r => r.json()).then(d => {
        var sel = document.getElementById('editSelect');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- 选择脚本 --</option>';
        if (d) d.forEach(function(s) { var opt = document.createElement('option'); opt.value = s.name; opt.textContent = s.name; sel.appendChild(opt); });
    }).catch(function() {});
};
window.loadEditContent = function() {
    var name = document.getElementById('editSelect').value;
    if (!name) return;
    fetch('/api/get/' + encodeURIComponent(name)).then(r => r.json()).then(d => {
        if (d.error) { alert(d.error); return; }
        document.getElementById('editContent').value = d.content || '';
    }).catch(function() {});
};
window.saveEdit = function() {
    var name = document.getElementById('editSelect').value;
    var content = document.getElementById('editContent').value;
    if (!name) { alert('请选择脚本'); return; }
    if (!content) { alert('内容不能为空'); return; }
    doRunTool('edit_script.py', ['--name', name, '--content', content], '✏️ 编辑脚本');
    window.closeModalByName('editModal');
};

// ---------- 删除脚本 ----------
window.init_delModal = function() {
    window.populateDelSelect();
};
window.populateDelSelect = function() {
    fetch('/api/scripts').then(r => r.json()).then(d => {
        var sel = document.getElementById('delSelect');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- 选择脚本 --</option>';
        if (d) d.forEach(function(s) { var opt = document.createElement('option'); opt.value = s.name; opt.textContent = s.name; sel.appendChild(opt); });
    }).catch(function() {});
};
window.deleteScript = function() {
    var name = document.getElementById('delSelect').value;
    if (!name) { alert('请选择脚本'); return; }
    if (!confirm('确定删除 "' + name + '" 吗？')) return;
    doRunTool('delete_script.py', ['--name', name], '🗑 删除脚本');
    window.closeModalByName('delModal');
};

// ---------- 上传脚本 ----------
window.doUpload = function() {
    var input = document.getElementById('uploadFileInput');
    if (!input.files || !input.files.length) { alert('请选择文件'); return; }
    var file = input.files[0];
    if (!file.name.endsWith('.py')) { alert('只支持 .py 文件'); return; }
    var output = document.getElementById('uploadOutput');
    output.style.display = 'block';
    output.textContent = '⏳ 读取文件...';
    var reader = new FileReader();
    reader.onload = function(e) {
        var content = e.target.result;
        var base64 = btoa(content);
        output.textContent = '⏳ 上传中...';
        fetch('/api/run_tool', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ script: 'upload_script.py', args: ['--filename', file.name, '--content', base64] })
        })
        .then(r => r.json())
        .then(d => {
            output.textContent = d.output || '执行完成';
            if (d.output && d.output.indexOf('✅') !== -1) { loadAll(); input.value = ''; }
        })
        .catch(e => { output.textContent = '❌ 上传失败: ' + e.message; });
    };
    reader.onerror = function() { output.textContent = '❌ 读取文件失败'; };
    reader.readAsText(file);
};

// ---------- 查看日志 ----------
window.init_logModal = function() {
    window.populateLogSelect();
};
window.populateLogSelect = function() {
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: 'view_log.py', args: ['--list'] })
    })
    .then(r => r.json())
    .then(d => {
        try {
            var list = JSON.parse(d.output);
            var sel = document.getElementById('logSelect');
            if (!sel) return;
            sel.innerHTML = '<option value="">📌 最新日志</option>';
            if (list && list.length) {
                list.forEach(function(name) {
                    var opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    sel.appendChild(opt);
                });
            }
            window.loadLog();
        } catch (e) {}
    })
    .catch(function() {});
};
window.loadLog = function() {
    var name = document.getElementById('logSelect').value;
    document.getElementById('logContent').textContent = '⏳ 加载中...';
    var args = name ? ['--name', name] : ['--latest'];
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: 'view_log.py', args: args })
    })
    .then(r => r.json())
    .then(d => { document.getElementById('logContent').textContent = d.output || '暂无输出'; })
    .catch(e => { document.getElementById('logContent').textContent = '❌ 加载失败: ' + e.message; });
};
window.clearCurrentLog = function() {
    var name = document.getElementById('logSelect').value;
    if (!name) { alert('请先选择一个具体的脚本'); return; }
    if (!confirm('确定清空 "' + name + '" 的日志吗？')) return;
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: 'view_log.py', args: ['--clear', '--name', name] })
    })
    .then(r => r.json())
    .then(d => { alert(d.output || '操作完成'); window.loadLog(); })
    .catch(e => { alert('操作失败: ' + e.message); });
};
window.clearAllLogs = function() {
    if (!confirm('⚠️ 确定要清空所有脚本的日志吗？此操作不可恢复！')) return;
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: 'view_log.py', args: ['--clear-all'] })
    })
    .then(r => r.json())
    .then(d => { alert(d.output || '操作完成'); window.loadLog(); window.populateLogSelect(); })
    .catch(e => { alert('操作失败: ' + e.message); });
};

// ---------- 同步 GitHub ----------
window.init_syncModal = function() {
    window.loadSyncConfig();
};
window.loadSyncConfig = function() {
    fetch('/api/run_tool', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ script: 'sync_github.py', args: ['--get-config'] })
    })
    .then(r => r.json())
    .then(d => {
        var input = document.getElementById('syncRepoInput');
        if (input) input.value = d.output.trim() || 'https://github.com/evol5201314/exetest';
    })
    .catch(e => {
        var input = document.getElementById('syncRepoInput');
        if (input) input.value = 'https://github.com/evol5201314/exetest';
    });
};
window.doSync = function() {
    var repo = document.getElementById('syncRepoInput').value.trim();
    if (!repo) { alert('请输入仓库地址'); return; }
    window.closeModalByName('syncModal');
    doRunTool('sync_github.py', ['--repo', repo], '📥 同步GitHub');
};
